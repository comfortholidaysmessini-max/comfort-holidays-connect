<style>
/* BODY RESET */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    position: relative;
    overflow-x: hidden;
}

/* FIXED BACKGROUND */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;

    background-image:
        linear-gradient(rgba(0, 40, 70, 0.35), rgba(0, 40, 70, 0.35)),
        url("https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Wave animation */
@keyframes wave {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

/* Logo — circular + DOUBLE GLOW */
.logo {
    width: 150px;
    height: 150px;
    margin: 22px auto 12px auto;
    display: block;
    animation: wave 3s ease-in-out infinite;
    border-radius: 50%;
    object-fit: cover;

    box-shadow:
        0 0 18px rgba(255, 255, 255, 0.55),
        0 0 8px rgba(255, 255, 255, 0.35) inset;
}

/* Responsive logo */
@media (max-width: 420px) {
    .logo {
        width: 135px;
        height: 135px;
        margin-top: 18px;
    }
}

/* Header text */
.header-title {
    font-size: 25px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 18px;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
}

/* Premium buttons – UNIFIED */
.button {
    display: flex;
    align-items: center;
    justify-content: flex-start;

    width: 88%;
    max-width: 340px;
    margin: 14px auto;
    padding: 14px 18px;

    background: linear-gradient(135deg, #0077aa, #004466);
    border-radius: 14px;

    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 18px;

    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Mobile button spacing */
@media (max-width: 420px) {
    .button {
        padding: 13px 16px;
        font-size: 17px;
        border-radius: 16px;
    }
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

/* Icons – UNIFIED + RESPONSIVE */
.icon {
    width: 42px;
    height: 42px;
    margin-right: 14px;
    border-radius: 10px;
    object-fit: contain;
}

@media (max-width: 420px) {
    .icon {
        width: 36px;
        height: 36px;
        margin-right: 12px;
    }
}

/* WhatsApp button */
.whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
}

/* Footer */
.footer {
    margin-top: 40px;
    padding: 20px;
    color: white;
    font-size: 14px;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
}

@media (max-width: 420px) {
    .footer {
        margin-top: 32px;
        font-size: 13px;
    }
}
</style>
