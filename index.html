<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comfort Holidays Connect</title>

<style>
/* BODY RESET */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    position: relative;
    overflow-x: hidden;
}

/* FIXED BACKGROUND (δουλεύει και σε κινητά) */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;

    background-image:
        linear-gradient(rgba(0, 40, 70, 0.35), rgba(0, 40, 70, 0.35)),
        url("https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Wave animation */
@keyframes wave {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

/* Logo — circular + DOUBLE GLOW */
.logo {
    width: 160px;
    height: 160px;
    margin: 25px auto 10px auto;
    display: block;
    animation: wave 3s ease-in-out infinite;
    border-radius: 50%;
    object-fit: cover;

    /* DOUBLE GLOW */
    box-shadow:
        0 0 18px rgba(255, 255, 255, 0.55),
        0 0 8px rgba(255, 255, 255, 0.35) inset;
}

/* Header text */
.header-title {
    font-size: 26px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 20px;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
}

/* Premium buttons */
.button {
    display: block;
    width: 85%;
    max-width: 330px;
    margin: 15px auto;
    padding: 15px;
    background: linear-gradient(135deg, #0077aa, #004466);
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

/* Icons */
.icon {
    width: 24px;
    height: 24px;
    vertical-align: middle;
    margin-right: 12px;
}

/* WhatsApp button */
.whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
}

/* Footer */
.footer {
    margin-top: 40px;
    padding: 20px;
    color: white;
    font-size: 14px;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<a class="button" href="https://www.tiktok.com/@comfort.holidays" target="_blank">
