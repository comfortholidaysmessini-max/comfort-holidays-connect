<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comfort Holidays Connect</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;

    /* Correct background layering */
    background-image:
        linear-gradient(rgba(0, 40, 70, 0.35), rgba(0, 40, 70, 0.35)),
        url("https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Wave animation */
@keyframes wave {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

/* Logo */
.logo {
    width: 160px;
    margin: 25px auto 10px auto;
    display: block;
    animation: wave 3s ease-in-out infinite;
}

/* Header text */
.header-title {
    font-size: 26px;
    font-weight: bold;
    color: white;
    margin-bottom: 20px;
}

/* Premium buttons */
.button {
    display: block;
    width: 85%;
    max-width: 330px;
    margin: 15px auto;
    padding: 15px;
    background: linear-gradient(135deg, #0077aa, #004466);
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

/* Icons */
.icon {
    width: 24px;
    height: 24px;
    vertical-align: middle;
    margin-right: 12px;
}

/* WhatsApp button */
.whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
}
</style>
</head>

<body>

<!-- Logo -->
<img class="logo" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/logo.png">

<div class="header-title">Comfort Holidays Connect</div>

<a class="button" href="https://www.comfortholidays.gr" target="_blank">
  <img class="icon" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/website.png">
  Website
</a>

<a class="button" href="https://www.facebook.com/profile.php?id=61575701638297" target="_blank">
  <img class="icon" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/Facebook.png">
  Facebook
</a>

<a class="button" href="https://www.instagram.com/comfort_holidays_messini/" target="_blank">
  <img class="icon" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/Instagram.png">
  Instagram
</a>

<a class="button" href="https://www.tiktok.com/@comfort.holidays" target="_blank">
  <img class="icon" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/TikTok.png">
  TikTok
</a>

<!-- Google Reviews Button -->
<a class="button" href="https://g.page/r/CYmUfjpQOwkQEBM/review" target="_blank">
  ⭐ Google Reviews
</a>

<!-- WhatsApp -->
<a class="button whatsapp" href="https://wa.me/30XXXXXXXXXX" target="_blank">
  <img class="icon" src="https://comfortholidaysmessini-max.github.io/comfort-holidays-connect/icons/WhatsApp.png">
  WhatsApp
</a>

</body>
</html>
